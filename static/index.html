<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Игровое Лобби</h1>
            <p>Управление списком игроков</p>
        </header>

        <main>
            <section class="add-player">
                <h2>Добавить игрока</h2>
                <form id="playerForm">
                    <input type="text" id="playerName" placeholder="Имя игрока" required>
                    <input type="number" id="playerLevel" placeholder="Уровень" min="1" value="1" required>
                    <button type="submit">Добавить</button>
                </form>
            </section>

            <section class="player-list">
                <h2>Список игроков в лобби</h2>
                <div id="playersContainer" class="grid">
                    <!-- Карточки будут здесь -->
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
