name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Go (версия должна совпадать с твоей в go.mod)
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27' 

    # 3. Скачиваем зависимости
    - name: Install dependencies
      run: go mod download

    # 4. Проверяем, что код компилируется без ошибок
    - name: Build Go application
      run: go build -v ./...

    # 5. Проверяем, что Docker-образ успешно собирается
    - name: Build Docker image
      run: docker build -t game-lobby:latest .